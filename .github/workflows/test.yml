name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]   # 3.9 is the python3 that ships with macOS
    container: python:${{ matrix.python }}-slim
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -v tests
