<text class="v" x="566.0" y="84">537 MB</text>
<rect class="b1" x="210" y="91" width="185.1" height="15" rx="4"><title>RAM used after: 284 MB</title></rect>
<text class="v" x="401.1" y="103">284 MB</text>
<text class="d" x="756" y="93" text-anchor="end">✓ -47%</text>
<line class="grid" x1="0" x2="760" y1="122" y2="122"/>
<text class="l" x="0" y="151">RAM truly free</text>
<text class="m" x="0" y="167">higher is better</text>
<rect class="b0" x="210" y="130" width="25.4" height="15" rx="4"><title>RAM truly free before: 49 MB</title></rect>
<text class="v" x="241.4" y="142">49 MB</text>
<rect class="b1" x="210" y="149" width="350.0" height="15" rx="4"><title>RAM truly free after: 675 MB</title></rect>
<text class="v" x="566.0" y="161">675 MB</text>
<text class="d" x="756" y="151" text-anchor="end">✓ ×13.8</text>
<line class="grid" x1="0" x2="760" y1="180" y2="180"/>
<text class="l" x="0" y="209">Processes in memory</text>
<text class="m" x="0" y="225">lower is better</text>
