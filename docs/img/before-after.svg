<text class="v" x="481.0" y="219">53</text>
<text class="d" x="756" y="209" text-anchor="end">✓ -24%</text>
<line class="grid" x1="0" x2="760" y1="238" y2="238"/>
<text class="l" x="0" y="267">Enabled packages</text>
