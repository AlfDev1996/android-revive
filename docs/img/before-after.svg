<text class="v" x="566.0" y="258">102</text>
<rect class="b1" x="210" y="265" width="205.9" height="15" rx="4"><title>Enabled packages after: 60</title></rect>
<text class="v" x="421.9" y="277">60</text>
<text class="d" x="756" y="267" text-anchor="end">✓ -41%</text>
</g></svg>